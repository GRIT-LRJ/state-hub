name: Verify committed source
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Keep real SQLite databases on the runner's temporary disk. Windows' user
      # TEMP lives on the much slower system volume; durability remains unchanged.
      - name: Use runner temporary disk on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm test:release
  desktop-lifecycle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use runner temporary disk on Windows
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:sidecar
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --features lifecycle-smoke
      - run: pnpm --filter @state-hub/desktop tauri build --no-bundle --features lifecycle-smoke --config src-tauri/tauri.lifecycle-smoke.conf.json
        env:
          VITE_STATE_HUB_LIFECYCLE_SMOKE: '1'
      - run: node tools/desktop-lifecycle-smoke.mjs apps/desktop/src-tauri/target/release/state-hub-desktop.exe
      - name: Build development-page lifecycle executable
        shell: pwsh
        run: |
          $env:TAURI_CONFIG = Get-Content apps/desktop/src-tauri/tauri.lifecycle-smoke.conf.json -Raw
          cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml --no-default-features --features lifecycle-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: node tools/desktop-dev-smoke.mjs apps/desktop/src-tauri/target/debug/state-hub-desktop.exe
